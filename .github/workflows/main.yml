name: Build Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
          
  build-launcher:
    name: Build launcher
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        working-directory: NBLApp
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:AssemblyTitle="NetBat2142" -p:Description="Game launcher for Battlefield 2142" -p:FileVersion="${{ github.event.release.tag_name }}.0" -p:InformationalVersion="${{ github.event.release.tag_name }}" -p:Version="${{ github.event.release.tag_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: |
            NBLApp/bin/Release/net10.0/win-x64/publish/NetBat2142.exe
          
  release:
    name: Add artifacts to release
    runs-on: windows-latest

    needs:
      - build-launcher

    steps:
      - name: Checkout
        uses: actions/checkout@v4
    
      - name: Download proxy
        uses: actions/download-artifact@v4
        with:
          name: build-launcher
          path: release

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          preserve_order: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release/NetBat2142.exe

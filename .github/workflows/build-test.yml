name: Test build

# Ручная сборка для проверки на проблемных машинах (не релиз, ничего не публикует и не подписывает).
on:
  workflow_dispatch:
    inputs:
      compress:
        description: Enable single-file compression
        type: boolean
        default: false

jobs:
  build:
    name: Build test exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        working-directory: NBLApp
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=${{ inputs.compress }} -p:DebugType=None -o ../out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NetBat2142-test-compress-${{ inputs.compress }}
          path: out/NetBat2142.exe

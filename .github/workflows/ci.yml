name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build launcher
        run: dotnet build NBLApp/NBLApp.csproj -c Release

      - name: Test
        run: dotnet test NBL.Tests/NBL.Tests.csproj -c Release

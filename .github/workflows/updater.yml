name: Updater file

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:

  updater:
    name: Updating the updater file
    runs-on: windows-latest
     
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Creating the file
        run: |
          echo "<?xml version="1.0" encoding="UTF-8"?>" > update.xml
          echo "<item>" > update.xml
          echo "<version>2.0.0.0</version>" > update.xml
          echo "<url>https://rbsoft.org/downloads/AutoUpdaterTest.zip</url>" > update.xml
          echo "<changelog>https://github.com/ravibpatel/AutoUpdater.NET/releases</changelog>" > update.xml
          echo "<mandatory>false</mandatory>" > update.xml
          echo "</item>" > update.xml

      - name: Commit and push file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.xml
          git commit -m "chore: add release info for ${{ github.ref_name }}" || echo "No changes"
          git push origin HEAD:${{ github.event.repository.default_branch }}
